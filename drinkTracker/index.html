<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <script src="drinkTracker.js" defer></script>
        <link rel="stylesheet" href="stylesheet.css">
    </head>
    <body>
        <h1>Drink Tracker</h1>
        <div id="serverRunning">
            <h2>Please wait for server to boot up</h2>
        </div>
        <div id="groups">
            <h2>Groups</h2>
            <div id="groupSelection">
                <ol id="groupList">
                    <li id="modalOn">Add Group</li>
                </ol>
            </div>
            <div id="addGroupModal">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <label for="groupName">Group Name:</label> 
                    <input type="text" id="groupName" name="groupName">
                    <label for="password">Group Password:</label> 
                    <input type="text" id="password" name="password">
                    <button type="button" id="submit">Submit</button>
                </div>
            </div>
            <div id="enterPassModal">
                <div class="modal-content">
                    <label for="groupPass">Enter Password:</label>
                    <input type="text" id="groupPass" name="groupPass">
                    <button type="button" id="submitPass">Submit</button>
                </div>
            </div>
        </div>
        <div id="members">
            <h2>Members</h2>
            <ol id="memberList">
                <li id="memberModalOn">Add Member</li>
            </ol>
            <div id="addMemberModal">
                <div class="modal-content">
                    <label for="username">Enter Username:</label>
                    <input type="text" id="username" name="username">
                    <button type="button" id="submitUsername">Submit</button>
                </div>
            </div>
        </div>
    </body>
</html>
